function pseudo(b,c){const out=[];
 for(let s=0;s<64;s++){const p=b[s];if(!p||p.c!==c)continue;const r=s>>3,f=s&7;
  const add=(r2,f2)=>{if(r2<0||r2>7||f2<0||f2>7)return 0;const t=b[r2*8+f2];if(t&&t.c===c)return 0;out.push({a:s,z:r2*8+f2,cap:t});return t?0:1};
  if(p.t==='p'){const d=c==='w'?-1:1,st=c==='w'?6:1,r1=r+d;
   if(r1>=0&&r1<8){if(!b[r1*8+f]){out.push({a:s,z:r1*8+f});if(r===st&&!b[(r+2*d)*8+f])out.push({a:s,z:(r+2*d)*8+f})}

 fl={p,c,t:0,x0:p.x,y0:p.y,x1:o[1],y1:o[2],x2:o[3],y2:o[4],th:d*.24+.2,n:Math.max(2,Math.round(d/1.1))}}
function over(t){phase='over';status(t);const g=gid;setTimeout(()=>{if(g===gid)reassemble()},2800)}
cv.onpointerdown=e=>{if(phase!=='play'||turn!=='w'||anim)return;
 const r=cv.getBoundingClientRect(),X=(e.clientX-r.left)*cv.width/r.width,Y=(e.clientY-r.top)*cv.height/r.height;
 let sq=-1;
 for(const p of[...pcs].filter(p=>p.vis&&p.alive).sort((a,b)=>b.y-a.y)){const[px,py,cw]=pr(p.x+.5,p.y+AY),s=cw*KS,d=SP[p.c+p.t],
  lx=Math.floor((X-px)/s+d.ax),ly=Math.floor((Y-py)/s+d.h);
  if(lx>=0&&lx<d.w&&ly>=0&&ly<d.h&&d.al[(ly*d.w+lx)*4+3]>40){sq=Math.round(p.y)*8+Math.round(p.x);break}}
 if(sq<0){const[u,v]=inv(X,Y),c=Math.floor(u),rw=Math.floor(v);if(c>=0&&c<8&&rw>=0&&rw<8)sq=rw*8+c}
 if(sq<0){sel=null;targets=[];return}
 const m=targets.find(m=>m.z===sq);if(m){play(m);return}
 const p=B[sq];if(p&&p.c==='w'){sel=sq;targets=legal(B,'w').filter(m=>m.a===sq)}else{sel=null;targets=[]}};
document.getElementById('rs').onclick=()=>{if(started&&phase!=='re')reassemble()};
/* ---------- разрушение и сборка ---------- */
function burst(u,v,n,sp,gold){const[X,Y,cw]=pr(u,v);for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.2+Math.random())*cw;
 sparks.push({x:X,y:Y-cw*.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-cw*.3,l:.5+Math.random()*.8,m:1.3,r:cw*(.02+Math.random()*.035),g:gold||Math.random()<.5})}}
function shatter(p,dx,dy){const d=SP[p.c+p.t],L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
 const cols=4,rows=6,pt=[],x0=-d.ax,w=d.w,h=d.h;
 const al=(x,y)=>{const ix=Math.round(x+d.ax),iy=Math.round(y+h);return ix<0||iy<0||ix>=d.w||iy>=d.h?0:d.al[(iy*d.w+ix)*4+3]};
 for(let j=0;j<=rows;j++){pt[j]=[];for(let i=0;i<=cols;i++){const e=!i||!j||i===cols||j===rows;
  pt[j][i]=[x0+w*i/cols+(e?0:(Math.random()-.5)*w*.13),-h+h*j/rows+(e?0:(Math.random()-.5)*h*.09)]}}
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=pt[j][i],b=pt[j][i+1],c=pt[j+1][i+1],e=pt[j+1][i];
  for(const tri of(Math.random()<.5?[[a,b,c],[a,c,e]]:[[a,b,e],[b,c,e]])){
   const gx=(tri[0][0]+tri[1][0]+tri[2][0])/3,gy=(tri[0][1]+tri[1][1]+tri[2][1])/3;
   if(![[gx,gy],...tri.map(v=>[(v[0]+gx)/2,(v[1]+gy)/2])].some(q=>al(q[0],q[1])>40))continue;
   const sp=1.2+Math.random()*3.2;
   shards.push({o:p,k:p.c+p.t,tri,c:{x:gx,y:gy},x:p.x+.5,y:p.y+AY,ox:gx,oy:gy,vo:-(80+Math.random()*420),a:0,al:1,
    vx:dx*sp+gx/w*3+(Math.random()-.5)*1.6,vy:dy*sp+(Math.random()-.5)*1.6,va:(Math.random()-.5)*14})}}}
function reassemble(){if(phase==='re')return;fl=null;pcs.forEach(p=>p.fear=0);gid++;phase='re';anim=null;sel=null;targets=[];cs=-1;RT=0;status('Магия возвращает фигуры…');
 for(const p of pcs){if(!p.alive&&p.vis){shatter(p,0,1);p.vis=0}
  Object.assign(p,{drop:0,fall:0,sx:p.x,sy:p.y,hx:p.home&7,hy:p.home>>3,wasDead:!p.alive,dl:Math.random()*.4,arr:0,lift:0,sc:1})}
 for(const s of shards){s.sx=s.x;s.sy=s.y;s.sox=s.ox;s.soy=s.oy;s.sa=((s.a%6.2832)+9.4248)%6.2832-3.1416;s.tx=s.o.hx+.5;s.ty=s.o.hy+AY;
  s.dl=Math.random()*.7;s.px=(Math.random()-.5)*1.2;s.py=(Math.random()-.5)*1.2}}
function finishRe(){shards=[];init()}
/* ---------- обновление ---------- */
function update(dt){
 if(fl){const f=fl,p=f.p;f.t+=dt;
  if(f.t<f.th){const u=f.t/f.th;p.x=f.x0+(f.x1-f.x0)*u;p.y=f.y0+(f.y1-f.y0)*u;p.lift=Math.abs(Math.sin(Math.PI*u*f.n))*.9;p.sc=1+.08*p.lift}
  else if(f.t<f.th+.8){const u=(f.t-f.th)/.8;p.x=f.x1+(f.x2-f.x1)*u;p.y=f.y1+(f.y2-f.y1)*u;p.lift=Math.sin(Math.PI*u)*1.4;p.sc=1+.08*p.lift;p.fall=1}
  else{const u=(f.t-f.th-.8)/.8;p.lift=0;p.fall=1;p.drop=5*u*u;p.al=cl(1-u*1.1);
   if(u>=1){fl=null;p.alive=0;p.vis=0;p.fall=0;p.drop=0;p.al=1;over(f.c==='w'?'Король спрыгнул с доски. Победили чёрные':'Король спрыгнул с доски. Вы победили!')}}}
 if(anim){const a=anim;a.t+=dt/a.d;const u=Math.min(1,a.t),e=ease(u);
  a.p.x=a.fx+(a.tx-a.fx)*e;a.p.y=a.fy+(a.ty-a.fy)*e;a.p.lift=Math.sin(Math.PI*u);a.p.sc=1+.08*a.p.lift;
  if(a.cap&&!a.hit&&u>=.8){a.hit=1;shatter(a.cap,a.tx-a.fx,a.ty-a.fy);a.cap.vis=0;burst(a.tx+.5,a.ty+AY,46,5,1)}
  if(u>=1){a.p.lift=0;a.p.sc=1;if(a.promo){a.p.t='q';burst(a.tx+.5,a.ty+AY,24,3,1)}anim=null;after()}}
 if(phase!=='re'){const f=Math.exp(-dt*3.6),g=Math.exp(-dt*3);
  for(const s of shards){s.x+=s.vx*dt;s.y+=s.vy*dt;s.a+=s.va*dt;s.vx*=f;s.vy*=f;s.va*=f;s.ox*=g;
   s.vo+=2600*dt;s.oy+=s.vo*dt;if(s.oy>0){s.oy=0;s.vo=Math.abs(s.vo)<150?0:-s.vo*.3}
   if(s.x<.15){s.x=.15;s.vx=Math.abs(s.vx)*.5}if(s.x>7.85){s.x=7.85;s.vx=-Math.abs(s.vx)*.5}
   if(s.y<.2){s.y=.2;s.vy=Math.abs(s.vy)*.5}if(s.y>7.9){s.y=7.9;s.vy=-Math.abs(s.vy)*.5}}}
 else{RT+=dt;
  for(const p of pcs){
   if(p.wasDead){if(RT>2.4){if(!p.vis){p.vis=1;p.x=p.hx;p.y=p.hy;p.t=p.ht;burst(p.hx+.5,p.hy+AY,26,3,0)}p.al=Math.min(1,(RT-2.4)/.8)}}
   else{const u=cl((RT-.2-p.dl)/1.6),e=ease(u);p.x=p.sx+(p.hx-p.sx)*e;p.y=p.sy+(p.hy-p.sy)*e;p.lift=Math.sin(Math.PI*u);p.sc=1+.1*p.lift;
    if(u>=1&&!p.arr){p.arr=1;p.t=p.ht;burst(p.hx+.5,p.hy+AY,14,2.5,0)}
    if(u>0&&u<1&&Math.random()<.4)burst(p.x+.5,p.y+AY,1,.6,1)}}
  for(const s of shards){const u=cl((RT-s.dl)/1.8),e=ease(u),w=Math.sin(Math.PI*u);
   s.x=s.sx+(s.tx-s.sx)*e+w*s.px;s.y=s.sy+(s.ty-s.sy)*e+w*s.py;s.a=s.sa*(1-e);
   s.ox=s.sox+(s.c.x-s.sox)*e;s.oy=s.soy+(s.c.y-s.soy)*e-w*70;
   s.al=RT>2.4?cl(1-(RT-2.4)/.8):1;
   if(u>0&&u<1&&Math.random()<.1){const[X,Y,cw]=pr(s.x,s.y);sparks.push({x:X+s.ox*cw*KS,y:Y+s.oy*cw*KS,vx:0,vy:-cw*.3,l:.5,m:.5,r:cw*.03,g:1})}}
  if(RT>=3.3)finishRe()}
 if(sel!==null&&targets.length&&Math.random()<.5){const m=targets[Math.random()*targets.length|0],[X,Y,cw]=pr((m.z&7)+Math.random(),(m.z>>3)+Math.random());sparks.push({x:X,y:Y,vx:(Math.random()-.5)*cw*.2,vy:-cw*(.3+Math.random()*.4),l:.8,m:.8,r:cw*.025,c:'#8fe6ff'})}
 for(const q of sparks){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.exp(-dt*2);q.vy*=Math.exp(-dt*2);q.l-=dt}
 sparks=sparks.filter(q=>q.l>0)}
/* ---------- рисование ---------- */
function cellPath(c,r){ctx.beginPath();[[c,r],[c+1,r],[c+1,r+1],[c,r+1]].forEach(([u,v],i)=>{const[x,y]=pr(u,v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}
function drawPiece(p){let[X,Y,cw]=pr(p.x+.5,p.y+AY);Y+=(p.drop||0)*cw;const s=cw*KS*p.sc,d=SP[p.c+p.t];
 ctx.save();ctx.globalAlpha=p.al;
 if(!p.fall){ctx.fillStyle='rgba(0,0,0,.33)';ctx.beginPath();ctx.ellipse(X,Y-s*5,d.bw*s*.54,d.bw*s*.15,0,0,6.3);ctx.fill()}
 let jx=0,jy=0;if(p.fear&&p.alive&&!anim&&phase!=='re'){const q=p.ph||(p.ph=Math.random()*9);jx=(Math.sin(T*57+q)*.014+Math.sin(T*89+q*2)*.008)*cw;jy=Math.sin(T*63+q*3)*.005*cw}
 ctx.drawImage(d.img,X-d.ax*s+jx,Y-d.h*s-p.lift*cw*.45+jy,d.w*s,d.h*s);ctx.restore()}
function drawShard(s){const d=SP[s.k],[X,Y,cw]=pr(s.x,s.y),k=cw*KS;
 ctx.save();ctx.globalAlpha=s.al;ctx.translate(X+s.ox*k,Y+s.oy*k);ctx.rotate(s.a);ctx.scale(k,k);ctx.translate(-s.c.x,-s.c.y);
 ctx.beginPath();s.tri.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.clip();
 ctx.drawImage(d.img,-d.ax,-d.h);ctx.restore()}
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(boardImg,0,0);
 if(cs>=0){const[X,Y,cw]=pr((cs&7)+.5,(cs>>3)+.5),rt=(pr(0,(cs>>3)+1)[1]-pr(0,cs>>3)[1])/cw;
  ctx.save();ctx.translate(X,Y);ctx.scale(1,rt);const g=ctx.createRadialGradient(0,0,0,0,0,cw*.7);g.addColorStop(0,'rgba(230,40,40,.65)');g.addColorStop(1,'rgba(230,40,40,0)');ctx.fillStyle=g;ctx.fillRect(-cw,-cw,cw*2,cw*2);ctx.restore()}
 if(sel!==null){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(150,225,255,.3)';cellPath(sel&7,sel>>3);ctx.fill();ctx.restore()}
 targets.forEach((m,i)=>{const c=m.z&7,r=m.z>>3,[X,Y,cw]=pr(c+.5,r+.5),rt=(pr(c+.5,r+1)[1]-pr(c+.5,r)[1])/cw,k=.5+.5*Math.sin(T*3+i*.9);
  ctx.save();cellPath(c,r);ctx.clip();ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(60,170,255,'+(.22+.16*k)+')';ctx.fillRect(X-cw,Y-cw,cw*2,cw*2);
  ctx.translate(X,Y);ctx.scale(1,rt);const g=ctx.createRadialGradient(0,0,0,0,0,cw*.62);g.addColorStop(0,'rgba(170,240,255,'+(.45+.25*k)+')');g.addColorStop(1,'rgba(60,170,255,0)');
  ctx.fillStyle=g;ctx.fillRect(-cw,-cw,cw*2,cw*2);ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';cellPath(c,r);ctx.strokeStyle='rgba(150,235,255,'+(.5+.3*k)+')';ctx.lineWidth=cw*.03;ctx.stroke();ctx.restore()});
 shards.forEach(drawShard);
 [...pcs].filter(p=>p.vis).sort((a,b)=>(a.y+a.lift*3)-(b.y+b.lift*3)).forEach(drawPiece);
 ctx.globalCompositeOperation='lighter';
 for(const q of sparks){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c||(q.g?'#ffd36a':'#fff6dc');ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.3);ctx.fill()}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
let last=0,T=0;function loop(t){T=t/1000;const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
</script></body></html>
